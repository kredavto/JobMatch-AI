Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogFile /dev/null
LogClean no
LogVerbose no
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 1
MaxQueue 2
ReadTimeout 3
CommandReadTimeout 1
SendBufTimeout 100
StreamMaxLength 4000000
MaxScanSize 20M
MaxFileSize 4M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 1500
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
ConcurrentDatabaseReload no
