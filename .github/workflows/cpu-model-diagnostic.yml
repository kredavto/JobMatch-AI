name: Pinned CPU model diagnostic (synthetic only)
on:
  pull_request:
    paths:
      - 'evaluation/**'
      - 'lib/**'
      - 'scripts/fetch_cpu_model.py'
      - 'scripts/test_fetch_cpu_model.py'
      - 'package*.json'
      - '.github/workflows/cpu-model-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'kredavto/JobMatch-AI' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      JOBMATCH_AI_CPU_DIAGNOSTIC: 'true'
      JOBMATCH_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: npm run test:ai-evaluation
      - run: python3 -m unittest discover -s scripts -p 'test_fetch_cpu_model.py'
      - name: Determine whether this commit changes executable inputs
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | rg -q -v '\.md$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only head: no new model run. Refer to the immutable runtime evaluation recorded in VERIFICATION.md; this is not fresh model acceptance."
          fi
      - name: Download public pinned weights and verify exact bytes/digest/revision pointer
        if: steps.scope.outputs.run == 'true'
        run: python3 scripts/fetch_cpu_model.py "$RUNNER_TEMP/jobmatch-cpu-model"
      - name: Build pinned llama.cpp locally (no registry publication or model cache)
        if: steps.scope.outputs.run == 'true'
        run: docker build -f evaluation/cpu/Dockerfile -t jobmatch-cpu-diagnostic:local evaluation/cpu
      - name: Actual CPU inference, no network, fixed synthetic corpus, no quality promotion
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          image_id="$(docker image inspect jobmatch-cpu-diagnostic:local --format '{{.Id}}')"
          timeout --signal=TERM --kill-after=10s 900s docker run --rm --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges --cpus 4 --memory 4g --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,size=64m --user 1000:1000 -v "$GITHUB_WORKSPACE:/app:ro" -v "$RUNNER_TEMP/jobmatch-cpu-model:/model:ro" -e CI=true -e GITHUB_ACTIONS=true -e JOBMATCH_AI_CPU_DIAGNOSTIC=true -e GITHUB_REPOSITORY=kredavto/JobMatch-AI -e JOBMATCH_REPOSITORY_VISIBILITY=public -e NODE_ENV=test -e JOBMATCH_AI_CPU_IMAGE_ID="$image_id" jobmatch-cpu-diagnostic:local
      - name: Dispose only the job-owned model directory
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/jobmatch-cpu-model"
