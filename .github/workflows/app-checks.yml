name: Simple MVP checks
on:
  pull_request:
  push:
    branches: [main, feat/simple-mvp-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --testTimeout 15000
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # No production keys or mailboxes: live-account tests are deliberately skipped.
      - run: npm run test:mvp:e2e
      - run: npx playwright test --config playwright.full-resume.config.ts
      # Rebuild only after default-off browser checks. This enables the client
      # panel for the loopback, route-mocked suite; server pilot stays disabled.
      - name: Build with the pilot panel visible for mocked Home checks
        run: npm run build
        env:
          NEXT_PUBLIC_JOBMATCH_FULL_REWRITE_PILOT: 'true'
      - name: Verify reviewed apply in the real app with mocked network edges
        run: npx playwright test --config playwright.reviewed-apply.config.ts
        env:
          JOBMATCH_PILOT_ENABLED: 'false'
