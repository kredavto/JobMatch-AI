name: English ordinary version acceptance
on:
  pull_request:
    paths: ['app/**', 'lib/**', 'tests/**', 'supabase/**', 'scripts/**', '.github/workflows/ordinary-english.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Create empty migration with actual pinned CLI
        if: ${{ hashFiles('supabase/migrations/*_ordinary_english_versions.sql') == '' }}
        run: python3 scripts/ordinary_english_migration_bootstrap.py
